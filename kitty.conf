# ====== Fonts ====== #
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.5
disable_ligatures never
modify_font cell_height 110%

# ====== Window ====== #
hide_window_decorations titlebar-only
window_margin_width 3
window_padding_width 8
confirm_os_window_close -2
remember_window_size no
initial_window_width 1200
initial_window_height 800
background_opacity 0.75
background_blur 30
dynamic_background_opacity yes
macos_titlebar_color background
macos_show_window_title_in window
macos_colorspace default
macos_quit_when_last_window_closed no

# ====== Cursor ====== #
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0
shell_integration enabled

# ====== Performance ====== #
repaint_delay 8
input_delay 1
sync_to_monitor yes
resize_draw_strategy static
resize_debounce_time 0.05

# ====== Scrollback ====== #
scrollback_lines 50000
scrollback_pager_history_size 100

# ====== Tabs ====== #
tab_bar_edge top
tab_bar_style separator
tab_separator " ┇ "
tab_bar_min_tabs 2
tab_activity_symbol ●
tab_title_max_length 25
tab_title_template "{fmt.fg.tab}{index}·{title}"

# ====== Tab navigation ====== #
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+0 goto_tab 10
map cmd+t launch --type=tab --cwd=current
map cmd+n launch --type=os-window --cwd=current

# ====== Transparency on the fly ====== #
# Cmd+Ctrl+T → more solid · Cmd+Ctrl+Y → more transparent
map cmd+ctrl+t set_background_opacity +0.05
map cmd+ctrl+y set_background_opacity -0.05
map cmd+ctrl+0 set_background_opacity 0.75

# ====== Tokyo Night Theme ====== #
# Matches the tmux theme — cool, modern, professional

foreground              #c0caf5
background              #1a1b26
selection_foreground    #c0caf5
selection_background    #283457

cursor                  #c0caf5
cursor_text_color       #1a1b26

url_color               #7aa2f7

active_border_color     #7aa2f7
inactive_border_color   #3b4261
bell_border_color       #e0af68

active_tab_foreground   #1a1b26
active_tab_background   #7aa2f7
active_tab_font_style   bold
inactive_tab_foreground #565f89
inactive_tab_background #1a1b26
inactive_tab_font_style normal
tab_bar_background      #1a1b26

# Marks
mark1_foreground #1a1b26
mark1_background #bb9af7
mark2_foreground #1a1b26
mark2_background #7aa2f7
mark3_foreground #1a1b26
mark3_background #9ece6a

# The 16 terminal colors

# black
color0 #15161e
color8 #414868

# red
color1 #f7768e
color9 #f7768e

# green
color2  #9ece6a
color10 #9ece6a

# yellow
color3  #e0af68
color11 #e0af68

# blue
color4  #7aa2f7
color12 #7aa2f7

# magenta
color5  #bb9af7
color13 #bb9af7

# cyan
color6  #7dcfff
color14 #7dcfff

# white
color7  #a9b1d6
color15 #c0caf5

# ====== Layouts & splits ====== #
enabled_layouts splits:split_axis=horizontal,stack
map cmd+d       launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+shift+f toggle_layout stack          # zoom focused pane
map cmd+shift+r layout_action rotate

map cmd+alt+h neighboring_window left
map cmd+alt+j neighboring_window down
map cmd+alt+k neighboring_window up
map cmd+alt+l neighboring_window right

# move the split itself, tmux-style
map cmd+alt+shift+h move_window left
map cmd+alt+shift+j move_window down
map cmd+alt+shift+k move_window up
map cmd+alt+shift+l move_window right

# resize
map cmd+alt+shift+left  resize_window narrower
map cmd+alt+shift+right resize_window wider
map cmd+alt+shift+up    resize_window taller
map cmd+alt+shift+down  resize_window shorter
map cmd+alt+0           resize_window reset

# focus is hard to read at 0.75 opacity — dim the inactive side
inactive_text_alpha 0.75
window_border_width 1pt
draw_minimal_borders no

# ====== tmux | herdr side by side ====== #
map cmd+shift+a combine : launch --type=tab --cwd=current zsh -lc "tmux new-session -A -s main" : launch --location=vsplit --cwd=current zsh -lc "herdr"
